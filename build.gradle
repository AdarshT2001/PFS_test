plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

sourceCompatibility = '17'
targetCompatibility = '17'


repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.31.58')
    implementation 'org.slf4j:slf4j-simple:2.0.7'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.jcraft:jsch:0.1.55'

    implementation 'software.amazon.awssdk:transfer:2.31.58'
    implementation 'software.amazon.awssdk:s3:2.17.85'
    implementation 'software.amazon.awssdk:sts:2.17.85'
    implementation 'software.amazon.awssdk:secretsmanager:2.17.85'
    implementation 'software.amazon.awssdk:auth:2.17.85'

}
